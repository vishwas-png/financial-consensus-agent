[pytest]
# Run from backend/ so tests can import the "src" package.
pythonpath = .
testpaths = tests
# Opt-in suites: `pytest -m live` (real Groq/yfinance/EDGAR/Google) and
# `pytest -m postgres` (needs TEST_POSTGRES_URL pointing at a throwaway Postgres)
addopts = -m "not live and not postgres"
markers =
    live: hits real external services (Groq, yfinance, EDGAR, Google); skipped by default
    postgres: needs a real Postgres in TEST_POSTGRES_URL; skipped by default

# Runs the offline test suites on every push and pull request.
# No secrets are needed: live tests (real Groq/yfinance/EDGAR/Google) are opt-in and skipped here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database for the postgres-marked tests (migrations + concurrent quota race)
      TEST_POSTGRES_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: pytest -q
      - name: Postgres tests
        run: pytest -q -m postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Builds the production image (what Render runs) and checks it actually works.
  docker-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Placeholder values: these checks never call Groq, Google or EDGAR
      PROD_ENV: >-
        -e APP_ENV=production
        -e GROQ_API_KEY=ci-placeholder
        -e GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com
        -e DATABASE_URL=postgresql://test:test@localhost:5432/app
        -e FRONTEND_ORIGIN=https://ci.example.com
        -e SEC_USER_AGENT=ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fca-api backend

      - name: Image size
        run: docker image ls fca-api --format 'fca-api image size {{.Size}}'

      - name: Embedding model is baked in (works with networking disabled) + peak memory estimate
        run: |
          docker run --rm --network none $PROD_ENV fca-api python - <<'EOF'
          import resource
          from src.main import app  # imports FastAPI, LangGraph, pandas/yfinance, chromadb, google-auth
          from chromadb.utils.embedding_functions import DefaultEmbeddingFunction
          from bs4 import BeautifulSoup

          embed = DefaultEmbeddingFunction()  # must load from the image cache: there is no network
          paragraphs = [f"Paragraph {i} on supply chains, revenue, margins and risk factors. " * 12 for i in range(300)]
          for start in range(0, len(paragraphs), 50):
              embed(paragraphs[start:start + 50])
          # Parse an HTML page about the size of a large 10-K (~2 MB), like first-time ingestion does
          html = "<html><body>" + "".join(f"<div><p>{p}</p><table><tr><td>{i}</td></tr></table></div>"
                                         for i, p in enumerate(paragraphs * 10)) + "</body></html>"
          BeautifulSoup(html, "lxml").get_text(" ")
          peak_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
          print(f"html size {len(html) / 1e6:.1f} MB, peak RSS {peak_mb:.0f} MB (Render free tier: 512 MB)")
          assert peak_mb < 450, "too close to the 512 MB limit"
          EOF

      - name: Container starts, runs migrations, and serves /health
        run: |
          docker run -d --name api --network host $PROD_ENV -e PORT=8000 fca-api
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS http://localhost:8000/health
          echo; echo "--- 401 without a token:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/history)" = "401"
          echo "--- security header present:"
          curl -sI http://localhost:8000/health | grep -i "x-content-type-options: nosniff"
          docker logs api 2>&1 | grep -i "Running upgrade" || (docker logs api; exit 1)
          docker exec api whoami | grep -x appuser

      - name: Production refuses to start without a required secret
        run: |
          if docker run --rm --network host -e APP_ENV=production fca-api 2> err.txt; then
            echo "expected startup to fail"; exit 1
          fi
          grep "Refusing to start in production" err.txt
          grep "GROQ_API_KEY is not set" err.txt

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true
